<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 min-h-screen text-slate-100 font-sans antialiased">
    
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <div class="max-w-2xl mx-auto px-4 py-12">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent mb-2">
                Minhas Tarefas
            </h1>
            <p class="text-purple-300/60 text-sm">Organize seu dia com estilo</p>
        </header>

        <main class="bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10 shadow-2xl p-6 mb-6">
            
            <form id="formTarefa" class="flex gap-3 mb-6 relative">
                <input 
                    type="text" 
                    id="titulo" 
                    placeholder="O que você precisa fazer?" 
                    aria-label="Título da nova tarefa"
                    class="flex-1 bg-white/10 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-purple-300/40 outline-none focus:border-purple-500/80 focus:bg-white/10 focus:ring-2 focus:ring-purple-500/20 transition-all duration-300"
                    autocomplete="off"
                    autofocus
                    required
                >
                <button 
                    type="submit" 
                    aria-label="Adicionar tarefa"
                    class="bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-400 hover:to-pink-400 text-white font-medium px-6 py-3 rounded-xl transition-all duration-300 hover:scale-105 active:scale-95 shadow-lg shadow-purple-500/25 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center min-w-[140px]"
                >
                    <i class="fas fa-plus mr-2"></i>Adicionar
                </button>
            </form>

            <nav class="flex gap-2 mb-6 flex-wrap" aria-label="Filtrar tarefas">
                <button onclick="filtrar('todas')" data-filtro="todas" class="filtro-btn px-4 py-2 rounded-xl text-sm font-medium bg-purple-500/20 text-purple-300 border border-purple-500/30 hover:bg-purple-500/30 transition-all duration-300">
                    Todas
                </button>
                <button onclick="filtrar('pendente')" data-filtro="pendente" class="filtro-btn px-4 py-2 rounded-xl text-sm font-medium bg-white/5 text-purple-300/60 border border-white/10 hover:bg-white/10 hover:text-purple-300 transition-all duration-300">
                    Pendentes
                </button>
                <button onclick="filtrar('concluida')" data-filtro="concluida" class="filtro-btn px-4 py-2 rounded-xl text-sm font-medium bg-white/5 text-purple-300/60 border border-white/10 hover:bg-white/10 hover:text-purple-300 transition-all duration-300">
                    Concluídas
                </button>
            </nav>

            <div id="listaTarefas" class="space-y-3 min-h-[150px]" aria-live="polite">
                <div class="text-center text-purple-300/40 py-12 flex flex-col items-center justify-center">
                    <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
                    <p class="text-sm font-medium">Conectando à API...</p>
                </div>
            </div>
        </main>

        <footer class="text-center text-purple-300/30 text-xs">
            <p>API configurada em <span class="text-purple-400/50 font-mono tracking-wide">http://localhost:3000</span></p>
        </footer>
    </div>

    <script>
        const API = 'http://localhost:3000';
        let filtroAtual = 'todas';
        const listaContainer = document.getElementById('listaTarefas');
        const inputTitulo = document.getElementById('titulo');

        // Proteção contra XSS (Cross-Site Scripting)
        const escapeHTML = (str) => {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        };

        // Sistema de Notificações (Toasts) substituindo os alerts
        function mostrarToast(mensagem, tipo = 'erro') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const cores = tipo === 'sucesso' 
                ? 'bg-emerald-500/90 border-emerald-500/50' 
                : 'bg-red-500/90 border-red-500/50';
                
            const icone = tipo === 'sucesso' ? 'fa-check-circle' : 'fa-exclamation-circle';

            toast.className = `flex items-center gap-3 px-4 py-3 rounded-lg border text-white text-sm font-medium shadow-lg backdrop-blur-md transform transition-all duration-300 translate-x-full opacity-0 ${cores}`;
            toast.innerHTML = `<i class="fas ${icone}"></i> ${mensagem}`;
            
            container.appendChild(toast);

            // Animação de entrada
            setTimeout(() => {
                toast.classList.remove('translate-x-full', 'opacity-0');
            }, 10);

            // Remover após 3 segundos
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function carregarTarefas() {
            try {
                const params = filtroAtual !== 'todas' ? `?status=${filtroAtual}` : '';
                const res = await fetch(`${API}/tarefas${params}`);
                
                if (!res.ok) throw new Error('Falha na resposta da API');
                
                const tarefas = await res.json();
                renderizarTarefas(tarefas);
            } catch (error) {
                listaContainer.innerHTML = `
                    <div class="text-center text-red-400/80 py-12 bg-red-500/5 rounded-xl border border-red-500/10">
                        <i class="fas fa-plug-circle-xmark text-4xl mb-3"></i>
                        <p class="font-medium mb-1">Não foi possível carregar as tarefas</p>
                        <p class="text-xs opacity-70">Verifique se sua API está rodando na porta 3000.</p>
                    </div>`;
            }
        }

        function renderizarTarefas(tarefas) {
            if (!tarefas.length) {
                const mensagem = filtroAtual === 'todas' 
                    ? 'Nenhuma tarefa criada ainda' 
                    : `Nenhuma tarefa ${filtroAtual} encontrada`;
                
                listaContainer.innerHTML = `
                    <div class="text-center text-purple-300/40 py-12">
                        <i class="fas fa-clipboard-list text-4xl mb-3 block opacity-50"></i>
                        <p>${mensagem}</p>
                    </div>`;
                return;
            }

            listaContainer.innerHTML = tarefas.map(t => {
                const isConcluida = t.status === 'concluida';
                const tituloSeguro = escapeHTML(t.titulo);
                
                return `
                    <div class="group flex items-center gap-4 bg-white/5 hover:bg-white/10 border border-white/5 hover:border-purple-500/30 rounded-xl p-4 transition-all duration-300 ${isConcluida ? 'opacity-60 bg-white/5 hover:bg-white/5' : ''}">
                        
                        <button onclick="alternarStatus(${t.id}, '${t.status}')" 
                                aria-label="${isConcluida ? 'Marcar como pendente' : 'Marcar como concluída'}"
                                class="flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all duration-300 hover:scale-110 focus:outline-none focus:ring-2 focus:ring-purple-500/50 ${isConcluida ? 'bg-emerald-500 border-emerald-500' : 'border-purple-400/40 hover:border-purple-400'}">
                            ${isConcluida ? '<i class="fas fa-check text-white text-xs"></i>' : ''}
                        </button>
                        
                        <div class="flex-1 min-w-0">
                            <p class="text-white/90 truncate transition-all duration-300 ${isConcluida ? 'line-through text-white/40' : ''}">
                                ${tituloSeguro}
                            </p>
                        </div>
                        
                        <span class="text-[10px] uppercase tracking-wider px-2 py-1 rounded-md font-bold ${isConcluida ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'}">
                            ${t.status}
                        </span>
                        
                        <button onclick="removerTarefa(${t.id})" 
                                aria-label="Remover tarefa"
                                class="text-red-400/40 hover:text-red-500 hover:bg-red-500/10 rounded-lg p-2 opacity-0 group-hover:opacity-100 transition-all duration-300 focus:opacity-100 focus:outline-none">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('formTarefa').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const titulo = inputTitulo.value.trim();
            
            if (!titulo) return;

            try {
                // Estado de "Carregando" no botão
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Salvando...';

                const res = await fetch(`${API}/tarefas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ titulo })
                });

                if (res.ok) {
                    inputTitulo.value = '';
                    inputTitulo.focus(); // Retorna o foco para facilitar novas inclusões
                    mostrarToast('Tarefa adicionada!', 'sucesso');
                    carregarTarefas();
                } else {
                    const erro = await res.json();
                    mostrarToast(erro.message || 'Erro ao adicionar tarefa');
                }
            } catch (error) {
                mostrarToast('Falha na conexão com o servidor');
            } finally {
                // Restaura o botão
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-plus mr-2"></i>Adicionar';
            }
        });

        async function alternarStatus(id, statusAtual) {
            try {
                const res = await fetch(`${API}/tarefas/${id}/concluir`, { method: 'PATCH' });
                if (!res.ok) throw new Error();
                
                // Feedback sutil
                const msg = statusAtual === 'concluida' ? 'Marcada como pendente' : 'Tarefa concluída!';
                mostrarToast(msg, 'sucesso');
                
                carregarTarefas();
            } catch (error) {
                mostrarToast('Erro ao atualizar status da tarefa');
            }
        }

        async function removerTarefa(id) {
            if (!confirm('Deseja realmente excluir esta tarefa?')) return;

            try {
                const res = await fetch(`${API}/tarefas/${id}`, { method: 'DELETE' });

                if (res.ok) {
                    mostrarToast('Tarefa removida com sucesso', 'sucesso');
                    carregarTarefas();
                } else {
                    const erro = await res.json();
                    mostrarToast(erro.message || 'Erro ao remover');
                }
            } catch (error) {
                mostrarToast('Falha de conexão ao tentar remover');
            }
        }

        function filtrar(status) {
            filtroAtual = status;
            
            document.querySelectorAll('.filtro-btn').forEach(btn => {
                const isAtivo = btn.dataset.filtro === status;
                
                if (isAtivo) {
                    btn.classList.add('bg-purple-500/30', 'text-white', 'border-purple-400/50', 'shadow-inner');
                    btn.classList.remove('bg-purple-500/20', 'bg-white/5', 'text-purple-300/60', 'border-white/10');
                } else {
                    btn.classList.remove('bg-purple-500/30', 'text-white', 'border-purple-400/50', 'shadow-inner');
                    btn.classList.add('bg-white/5', 'text-purple-300/60', 'border-white/10');
                }
            });

            // Mostra o loader rápido na transição de filtros
            listaContainer.innerHTML = `
                <div class="text-center text-purple-300/40 py-8">
                    <i class="fas fa-circle-notch fa-spin text-2xl"></i>
                </div>`;
                
            carregarTarefas();
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', carregarTarefas);
    </script>
</body>
</html>
